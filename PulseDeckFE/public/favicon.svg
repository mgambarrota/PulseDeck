<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PulseDeck">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#4fc3f7" stroke-width="2"/>
  <polyline points="9,32 20,32 24,32 27,28 30,32 33,18 36,46 39,32 44,32 47,28 50,32 55,32"
            fill="none" stroke="#4fc3f7" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)"/>
</svg>
